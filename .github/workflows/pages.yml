# Publishes the web app to GitHub Pages: meetings, live, schedules, and the rest, kept in each browser (IndexedDB),
# and synced with a hub when one is set: the PAGES_HUB_URL variable (your hub's api.php address) makes it the default,
# and anyone can change it under Settings. Without it, the site keeps everything in the browser. Turn on Pages for the
# repository with "GitHub Actions" as the source; it runs by hand, or on every push to main once the PAGES_ON_PUSH
# variable is true. See docs/hub/deploy.md.
name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || vars.PAGES_ON_PUSH == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_ROUTER: hash
          VITE_HUB_URL: ${{ vars.PAGES_HUB_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
