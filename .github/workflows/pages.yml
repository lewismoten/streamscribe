# Publishes the web app to GitHub Pages, for any fork of this repository. Two ways it can work:
#   - with a hub (the default): the site syncs with https://streamscribe.lewismoten.com/hub/api.php, or the hub in the
#     PAGES_HUB_URL variable (its api.php address, or its website's, which finds it); that hub's admin adds
#     https://<owner>.github.io under Accounts → Hub settings ("Other sites that may use this hub").
#   - on its own: set PAGES_HUB_URL to none, and each visitor's browser keeps its own data (IndexedDB).
# Visitors can point the site at another hub, or disconnect, under Settings either way; when the hub doesn't answer,
# the site keeps working with what the browser has. To use it: in the repository's
# Settings → Pages choose "GitHub Actions" as the source. It publishes on every push to main (set the PAGES_ON_PUSH
# variable to false to publish only when run from the Actions tab). See docs/hub/deploy.md.
name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || vars.PAGES_ON_PUSH != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Fails with a clear message when the repository's Pages aren't set to "GitHub Actions" yet.
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build
        run: |
          hub="${PAGES_HUB_URL:-https://streamscribe.lewismoten.com/hub/api.php}"
          [ "$hub" = "none" ] && hub=""
          VITE_HUB_URL="$hub" npm run build
        env:
          PAGES_HUB_URL: ${{ vars.PAGES_HUB_URL }}
          # A <owner>.github.io repository is served from the root; any other from /<repository>/.
          VITE_BASE: ${{ endsWith(github.event.repository.name, '.github.io') && '/' || format('/{0}/', github.event.repository.name) }}
          VITE_SITE_URL: ${{ endsWith(github.event.repository.name, '.github.io') && format('https://{0}', github.event.repository.name) || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
          VITE_ROUTER: hash
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
