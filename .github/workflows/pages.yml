# Publishes the web app to GitHub Pages, for any fork of this repository. Two ways it can work:
#   - on its own: each visitor's browser keeps its own data (IndexedDB); nothing is shared. This is the default.
#   - with a hub: set the PAGES_HUB_URL variable to a hub's api.php address (such as
#     https://streamscribe.lewismoten.com/hub/api.php), and the site syncs with it; the hub's config.php must list
#     https://<owner>.github.io in allowed_origins.
# Visitors can point the site at another hub, or none, under Settings either way. To use it: in the repository's
# Settings → Pages choose "GitHub Actions" as the source, then run this workflow from the Actions tab; set the
# PAGES_ON_PUSH variable to true to publish on every push to main. See docs/hub/deploy.md.
name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || vars.PAGES_ON_PUSH == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # A <owner>.github.io repository is served from the root; any other from /<repository>/.
          VITE_BASE: ${{ endsWith(github.event.repository.name, '.github.io') && '/' || format('/{0}/', github.event.repository.name) }}
          VITE_SITE_URL: ${{ endsWith(github.event.repository.name, '.github.io') && format('https://{0}', github.event.repository.name) || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
          VITE_ROUTER: hash
          VITE_HUB_URL: ${{ vars.PAGES_HUB_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
