# Deploys the hub (PHP) and the web app to your server over SSH whenever main changes (or when run by hand), with
# bin/deploy-hub.sh. The settings live in the repository's "production" environment (Settings → Environments), or at
# the repository level; nothing is deployed until DEPLOY_HOST is set. What to set up: docs/hub/deploy.md.
#   Variables: DEPLOY_HOST, DEPLOY_USER, DEPLOY_PATH, and optionally DEPLOY_PORT, SITE_BASE, SITE_URL, REMOTE_PHP
#   Secrets:   DEPLOY_SSH_KEY (a private key the server accepts), DEPLOY_KNOWN_HOSTS (ssh-keyscan of the server)
name: Deploy hub
on:
  push:
    branches: [main]
    paths: ['hub-php/**', 'web/**', 'src/sync/**', 'package.json', 'package-lock.json', 'vite.config.ts', 'bin/deploy-hub.sh', '.github/workflows/deploy-hub.yml']
  workflow_dispatch:
concurrency:
  group: deploy-hub
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      # (An environment's variables can't be read by a job's `if`, so this step decides whether the rest run.)
      - id: check
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          if [ -n "$DEPLOY_HOST" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; else echo "::notice::DEPLOY_HOST isn't set; nothing to deploy"; fi
      - if: steps.check.outputs.ready == 'true'
        uses: actions/checkout@v4
      - if: steps.check.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - if: steps.check.outputs.ready == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite
      - if: steps.check.outputs.ready == 'true'
        run: npm ci
      - if: steps.check.outputs.ready == 'true'
        run: npm test
      - if: steps.check.outputs.ready == 'true'
        name: SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - if: steps.check.outputs.ready == 'true'
        run: bin/deploy-hub.sh
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          SITE_BASE: ${{ vars.SITE_BASE || '/' }}
          SITE_URL: ${{ vars.SITE_URL }}
          REMOTE_PHP: ${{ vars.REMOTE_PHP || 'php' }}
          DEPLOY_SSH_OPTIONS: -i ~/.ssh/deploy_key -o IdentitiesOnly=yes
